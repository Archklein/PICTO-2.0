<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PICTO - PCT Calinan's Localized market</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <nav class="navtop">
      <div class="menu_toggle">
        <button id="menu__toggle__btn" class="menu_toggle_btn" type="button">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="lucide lucide-text-align-start preview-icon"
          >
            <path d="M21 5H3" />
            <path d="M15 12H3" />
            <path d="M17 19H3" />
          </svg>
        </button>
      </div>

      <div class="logo">
        <img src="https://calinan.pctdavao.edu.ph/img/logo2.png" alt="" />
      </div>
    </nav>
    <div id="overlay_id" class="overlay"></div>
    <div class="menu_list" id="menu__list">
      <div class="menu_exit">
        <div class="exit_div">
          <button type="button" id="exit__button">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="22"
              height="22"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              class="lucide lucide-chevron-left preview-icon"
            >
              <path d="m15 18-6-6 6-6" />
            </svg>
          </button>
        </div>
        <div class="menu_logo">
          <img src="https://calinan.pctdavao.edu.ph/img/logo2.png" alt="" />
        </div>
      </div>

      <!-- <a href="#">My Listings</a>
      <a href="#">Meetup Spots</a>
      <a href="#">About PICTO</a>
      <a href="#">Send Feedback</a>
      <a href="#">Settings</a> -->
    </div>
    <script src="index.js"></script>
  </body>
</html>
