<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PICTO - PCT Calinan's Localized market</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <nav class="navtop">
      <div class="menu_toggle_div">
        <button type="button" class="menu_toggle" id="menu__toggle">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.75"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="lucide lucide-text-align-justify preview-icon"
          >
            <path d="M3 5h18" />
            <path d="M3 12h18" />
            <path d="M3 19h18" />
          </svg>
        </button>
      </div>

      <div class="logo">
        <img src="images/Picto_singleLogo_transparentBG.png" alt="" />
      </div>

      <div class="search_div">
        <button type="button" class="search_btn" id="search__btn">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="20" y1="20" x2="16.65" y2="16.65"></line>
          </svg>
        </button>
      </div>
    </nav>
    <script src="index.js"></script>
  </body>
</html>
